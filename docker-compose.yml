services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sop
      POSTGRES_USER: sop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sop -d sop"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      [
        "gotenberg",
        "--api-timeout=120s",
        "--libreoffice-disable-routes=false",
        "--chromium-disable-routes=true",
        "--libreoffice-auto-start=true",
        "--libreoffice-allow-list=^$",
        "--libreoffice-deny-list=.*",
      ]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      STORAGE_PATH: /app/storage
      GOTENBERG_URL: http://gotenberg:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    command: [sh, -c, "cp -r /usr/share/nginx/html/. /static/"]
    volumes:
      - static:/static
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  static:
